# Refresh the misc-page video tickers from the YouTube playlists.
#
# Runs weekly and on demand. If either playlist changed (new videos, or a
# different sort order), the data files and the generated pages are rebuilt
# and committed. Nothing is committed when nothing changed.
#
# Caveat: this scrapes the public playlist page, because the playlist RSS feed
# returns only 15 entries and the Data API would need a key. YouTube may serve
# a consent interstitial or a bot check to datacentre IPs such as GitHub's
# runners. The fetch script exits non-zero when it parses zero videos, so the
# job fails loudly rather than committing an empty list.

name: Refresh playlists

on:
  schedule:
    - cron: "17 6 * * 1"        # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-playlists
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Fetch playlists
        run: python3 tools/fetch_playlists.py

      - name: Rebuild site
        run: python3 tools/build_site.py

      - name: Validate
        run: python3 tools/check_site.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*_videos.json misc.html
          git commit -m "refresh video tickers from YouTube playlists"
          git push
